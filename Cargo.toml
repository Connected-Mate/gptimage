[workspace]
resolver = "2"
members = [
    "crates/imagegen-core",
    "crates/imagegen-providers",
    "crates/imagegen-mcp",
    "crates/imagegen-cli",
    "crates/provider-chatgpt-login",
]
# Every crate is part of the default build, the ChatGPT-login provider included (decision D-12a).
default-members = [
    "crates/imagegen-core",
    "crates/imagegen-providers",
    "crates/imagegen-mcp",
    "crates/imagegen-cli",
    "crates/provider-chatgpt-login",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/klimPaskov/hoi4-imagegen-mcp"
authors = ["klimPaskov and hoi4-imagegen-mcp contributors"]

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
toml = "1"
ureq = { version = "3", default-features = true }

# The shared HOI4 engine (klimPaskov/hoi4-agent-tools, Apache-2.0, publish = false). One pin for both crates: the
# merge commit of hoi4-agent-tools PR #73 (sprite index, trace and audit) on main.
hoi4-syntax = { git = "https://github.com/klimPaskov/hoi4-agent-tools", rev = "313c2aa100d01f0d393664ad558f92b17bae1727", package = "hoi4-syntax" }
hoi4-engine = { git = "https://github.com/klimPaskov/hoi4-agent-tools", rev = "313c2aa100d01f0d393664ad558f92b17bae1727", package = "hoi4-engine" }

imagegen-core = { path = "crates/imagegen-core" }
imagegen-providers = { path = "crates/imagegen-providers" }
imagegen-mcp = { path = "crates/imagegen-mcp" }
provider-chatgpt-login = { path = "crates/provider-chatgpt-login" }

[profile.dev]
# Keeps debug build output small on a nearly full disk; line tables are enough for backtraces.
debug = false

[profile.dev.package."*"]
debug = false
