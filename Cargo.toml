[workspace]
resolver = "2"
members = [
    "crates/imagegen-core",
    "crates/imagegen-providers",
    "crates/imagegen-mcp",
    "crates/imagegen-cli",
    "crates/provider-chatgpt-login",
]
# The opt-in ChatGPT-login plugin is a workspace member (so it shares the lock file and can be
# tested with `-p provider-chatgpt-login`) but it is NOT a default member, and no default build
# depends on it. See docs/unofficial-chatgpt-login.md and crates/imagegen-mcp/tests/plugin_isolation.rs.
default-members = [
    "crates/imagegen-core",
    "crates/imagegen-providers",
    "crates/imagegen-mcp",
    "crates/imagegen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/klimPaskov/hoi4-imagegen-mcp"
authors = ["klimPaskov and hoi4-imagegen-mcp contributors"]

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
toml = "1"
ureq = { version = "3", default-features = true }

imagegen-core = { path = "crates/imagegen-core" }
imagegen-providers = { path = "crates/imagegen-providers" }
imagegen-mcp = { path = "crates/imagegen-mcp" }
provider-chatgpt-login = { path = "crates/provider-chatgpt-login" }

[profile.dev]
# Keeps debug build output small on a nearly full disk; line tables are enough for backtraces.
debug = false

[profile.dev.package."*"]
debug = false
