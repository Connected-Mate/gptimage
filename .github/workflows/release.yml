name: Release

on:
  push:
    tags: ["v*"]
  # a change to this workflow builds every target on its pull request; publishing and attestation stay tag-only
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip }
          - { target: aarch64-apple-darwin, os: macos-15, ext: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-15-intel, ext: tar.gz }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p imagegen-mcp -p imagegen-cli
      - name: Package
        shell: bash
        run: |
          set -eu
          name="hoi4-imagegen-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release"
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=".exe";; esac
          cp "$bin/hoi4-imagegen-mcp$suffix" "$bin/hoi4-imagegen$suffix" "dist/$name/"
          cp LICENSE NOTICE README.md UPSTREAM.md "dist/$name/"
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - name: Smoke test
        shell: bash
        run: |
          set -eu
          case "${{ matrix.target }}" in *windows*) suffix=".exe";; *) suffix="";; esac
          "target/${{ matrix.target }}/release/hoi4-imagegen$suffix" --version
          "target/${{ matrix.target }}/release/hoi4-imagegen-mcp$suffix" --version
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/hoi4-imagegen-*.${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/hoi4-imagegen-*.${{ matrix.ext }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum hoi4-imagegen-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Per-platform binaries of hoi4-imagegen (CLI) and hoi4-imagegen-mcp (MCP stdio server). Unsigned; verify with SHA256SUMS and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
