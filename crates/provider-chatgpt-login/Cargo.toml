[package]
name = "provider-chatgpt-login"
description = "ChatGPT-login image provider for local use: signs in with your own ChatGPT account (gpt-6-luna, high effort). Never part of a hosted deployment."
version.workspace = true
edition.workspace = true
# std's File::try_lock (cross-process file lock) is stable from 1.89; the pinned toolchain is newer.
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64.workspace = true
getrandom = "0.4"
imagegen-core.workspace = true
imagegen-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
image.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
